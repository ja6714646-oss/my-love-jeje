<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ My Love Jeje ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0d1117,#1f2937,#2b1055,#ff4d6d);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    font-family:Tahoma,sans-serif;
    overflow:hidden;
    padding:20px;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:100%;
    max-width:700px;
    text-align:center;
    color:white;
}

.box{
    width:min(250px,70vw);
    height:min(250px,70vw);
    margin:auto;
    background:linear-gradient(145deg,#8b4513,#a0522d);
    border-radius:20px;
    position:relative;
    box-shadow:0 0 30px rgba(0,0,0,.5);
    transition:1s;
}

.lock{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:clamp(55px,8vw,80px);
}

h2{
    margin:25px 0 15px;
}

input{
    width:100%;
    max-width:350px;
    padding:14px;
    border:none;
    border-radius:12px;
    text-align:center;
    font-size:16px;
}

button{
    width:100%;
    max-width:350px;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    background:#ff4d6d;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
}

#lovePage{
    display:none;
    animation:fadeIn 1.5s ease;
}

.card{
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:30px;
    line-height:2;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.heart{
    position:absolute;
    color:#ff7aa2;
    animation:float 6s linear infinite;
    opacity:.8;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-120px);
    }
}

#error{
    color:#ffb3b3;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

<div id="lockPage">

    <div class="box" id="box">
        <div class="lock" id="lock">🔒</div>
    </div>

    <h2>❤️ افتحي الصندوق ❤️</h2>

    <input
        type="password"
        id="password"
        placeholder="اكتبي كلمة السر..."
    >

    <br>

    <button onclick="openBox()">فتح الصندوق</button>

    <div id="error"></div>

</div>

<div id="lovePage">

    <div class="card">

        <h1>❤️ إلى جيجي ❤️</h1>

        <p id="message"></p>

    </div>

</div>

</div>

<script>
const text = `
يا جيجي ❤️

من أحلى الحاجات اللي حصلتلي إني عرفتك.

بحب ضحكتك وكلامك وطريقتك،
وبحب وجودك في حياتي أكتر ما تتخيلي.

كل يوم بيعدي بحمد ربنا إني عرفتك،
وإنك بقيتي شخص مميز بالنسبالي.

أتمنى أشوفك دايمًا مبسوطة،
وأفضل سبب في رسم الابتسامة على وشك.

I Love You Jeje ❤️
`;

function openBox(){

    const pass =
    document.getElementById("password").value.trim();

    if(pass === "My Love Jeje"){

        document.getElementById("error").innerHTML="";

        document.getElementById("lock").innerHTML="🔓";

        document.getElementById("box").style.transform=
        "rotateY(360deg) scale(1.05)";

        setTimeout(()=>{

            document.getElementById("lockPage").style.display="none";
            document.getElementById("lovePage").style.display="block";

            typeWriter();

        },1000);

    }else{

        document.getElementById("error").innerHTML=
        "❌ كلمة السر غير صحيحة";
    }
}

function typeWriter(){

    let i=0;
    const speed=40;
    const msg=document.getElementById("message");

    function typing(){
        if(i<text.length){
            msg.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing,speed);
        }
    }

    typing();
}

for(let i=0;i<20;i++){

    const heart=document.createElement("div");

    heart.classList.add("heart");
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"%";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    heart.style.animationDuration=(4+Math.random()*6)+"s";

    document.body.appendChild(heart);
}
</script>

</body>
</html>
